<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extShortName">FocusFence</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <main class="popup" id="app" aria-busy="true">
      <h1 class="visually-hidden">FocusFence</h1>
      <header class="top">
        <span class="logo" id="logo"><span>FocusFence</span></span>
        <span class="badge" id="plan-badge">FREE</span>
        <span class="spacer"></span>
        <button class="btn btn-ghost icon-btn" id="open-options" title="Settings" aria-label="Open settings" data-i18n-attr="title:settings;aria-label:openSettings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </header>

      <section class="status card" id="status-card">
        <div class="status-text" aria-live="polite">
          <h2 id="status-title" data-i18n="statusOn">Blocking is on</h2>
          <p class="muted small" id="status-sub">—</p>
        </div>
        <label class="switch" title="Turn blocking on or off" data-i18n-attr="title:toggleTitle">
          <input type="checkbox" id="toggle-enabled" aria-label="Blocking enabled" data-i18n-attr="aria-label:blockingEnabledAria" />
          <span class="track"></span>
        </label>
      </section>

      <p class="warn small" id="incognito-note" hidden>
        <span data-i18n="incognitoNote">Incognito windows aren't covered.</span> <a href="#" id="incognito-fix" data-i18n="incognitoFix">Allow FocusFence in Incognito</a>
      </p>

      <form class="unlock card hidden" id="unlock-form">
        <p class="small"><strong data-i18n="unlockTitle">Settings are locked.</strong> <span data-i18n="unlockText">Enter your password to continue.</span></p>
        <div class="row">
          <input class="input" type="password" id="unlock-password" placeholder="Password" aria-label="Password" data-i18n-attr="placeholder:password;aria-label:password" autocomplete="current-password" />
          <button class="btn btn-primary" type="submit" data-i18n="unlock">Unlock</button>
        </div>
      </form>

      <section class="current card" id="current-site">
        <span class="avatar" id="current-avatar">?</span>
        <div class="current-text">
          <div class="current-host" id="current-host" data-i18n="thisPage">This page</div>
          <div class="muted small" id="current-note" data-i18n="currentTab">Current tab</div>
        </div>
        <button class="btn btn-primary btn-sm" id="quick-add" disabled data-i18n="blockSite">Block site</button>
      </section>

      <form class="add" id="add-form" autocomplete="off">
        <input class="input" id="add-input" placeholder="Add a site, e.g. reddit.com" aria-label="Website to block" data-i18n-attr="placeholder:addPlaceholder;aria-label:addAria" />
        <button class="btn" type="submit" id="add-btn" data-i18n="add">Add</button>
      </form>

      <section class="focus card" id="focus-card">
        <div class="focus-head">
          <div>
            <h3 data-i18n="statusFocus">Focus session</h3>
            <p class="muted small" id="focus-sub">25 min focus · 5 min break</p>
          </div>
          <span class="badge badge-pro hidden" id="focus-pro">PRO</span>
        </div>
        <div class="focus-body">
          <div class="timer" id="focus-timer" role="timer" aria-label="Focus time" data-i18n-attr="aria-label:focusTimerAria">25:00</div>
          <button class="btn btn-primary" id="focus-start" data-i18n="startFocus">Start focus</button>
          <button class="btn hidden" id="focus-stop" data-i18n="stop">Stop</button>
        </div>
      </section>

      <footer class="foot">
        <span class="muted small" id="today-stats">0 blocked today</span>
        <a href="#" id="open-options-2" class="small" data-i18n="allSettings">All settings →</a>
      </footer>
    </main>
    <script src="lib/i18n.js"></script>
    <script src="lib/core.js"></script>
    <script src="lib/ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
